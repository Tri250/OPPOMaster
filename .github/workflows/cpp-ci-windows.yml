name: Alcedo Studio C++ CI (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      preset:
        description: 'CMake preset to use'
        required: false
        default: 'win_debug'
        type: choice
        options:
          - win_debug
          - win_release
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

timeout-minutes: 120

jobs:
  build-and-test:
    runs-on: windows-2022

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.1'
          method: 'network'

      - name: Install OpenCL SDK
        run: |
          $openclUrl = "https://github.com/KhronosGroup/OpenCL-SDK/releases/download/v2023.04.17/OpenCL-SDK-v2023.04.17-Win-x64.zip"
          $openclZip = "$env:RUNNER_TEMP\opencl-sdk.zip"
          $openclDir = "$env:RUNNER_TEMP\opencl-sdk"
          Invoke-WebRequest -Uri $openclUrl -OutFile $openclZip
          Expand-Archive -Path $openclZip -DestinationPath $openclDir -Force
          echo "OPENCL_ROOT=$openclDir" >> $env:GITHUB_ENV

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "b322364f06308bdd24823f9d8f03fe0cc86fd46f"

      - name: Configure CMake
        run: cmake --preset ${{ inputs.preset || 'win_debug' }}
        env:
          CMAKE_PREFIX_PATH: ${{ env.OPENCL_ROOT }}

      - name: Build CI targets
        run: cmake --build --preset ${{ inputs.preset || 'win_debug' }}

      - name: Run tests
        if: ${{ inputs.skip_tests != true }}
        run: ctest --preset ${{ inputs.preset || 'win_debug' }} --output-on-failure
