name: Rust CI

on:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: puerh_mind tests (no real models)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # The ORT inference tests download real ONNX models unless explicitly
      # opted in. Leave both unset so every model-dependent test self-skips and
      # only the pure-logic tests (config, device parsing, asset validation,
      # embedding transforms, batching) actually run.
      ALCEDO_MIND_TEST_ALLOW_DOWNLOAD: ""
      ALCEDO_MIND_TEST_MODEL_ROOT: ""
    defaults:
      run:
        working-directory: rust/puerh_mind
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: brew install protobuf

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/puerh_mind

      - name: Build tests
        run: cargo build --tests --locked

      - name: Test
        run: cargo test --locked --no-fail-fast
