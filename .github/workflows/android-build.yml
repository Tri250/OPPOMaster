name: Android Build

on:
  push:
    branches:
      - main
      - 'trae/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.4
      
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: |
          ./gradlew clean build --no-daemon
      
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon
      
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      
      - name: Run Unit Tests
        run: |
          ./gradlew test --no-daemon
      
      - name: Generate Build Report
        if: always()
        run: |
          echo "=== Build Summary ===" > build-summary.txt
          echo "Build Status: ${{ job.status }}" >> build-summary.txt
          echo "Date: $(date)" >> build-summary.txt
          echo "Branch: ${{ github.ref }}" >> build-summary.txt
          echo "Commit: ${{ github.sha }}" >> build-summary.txt
          
      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-summary
          path: build-summary.txt
          retention-days: 14
