name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.4)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ALCEDO_VERSION: ${{ inputs.version || '' }}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ -n "${ALCEDO_VERSION}" ]]; then
            version="${ALCEDO_VERSION}"
            tag="v${version}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")"
            version="${version#v}"
            tag="v${version}"
          fi

          is_prerelease="false"
          if [[ "${version}" == *"-"* ]] || [[ "${{ inputs.prerelease }}" == "true" ]]; then
            is_prerelease="true"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${version} (tag: ${tag}, prerelease: ${is_prerelease})"

      - name: Generate changelog
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")"
          if [[ -n "${prev_tag}" ]]; then
            changes="$(git log "${prev_tag}..HEAD" --pretty=format:"- %s (%h)" --no-merges)"
          else
            changes="$(git log --pretty=format:"- %s (%h)" --no-merges -50)"
          fi

          cat > RELEASE_NOTES.md <<HEREDOC
          ## AlcedoStudio ${{ steps.version.outputs.version }}

          ### Changes
          ${changes}

          ### Downloads
          - **Windows**: AlcedoStudio-${{ steps.version.outputs.version }}-Windows-AMD64.exe
          - **macOS**: AlcedoStudio-${{ steps.version.outputs.version }}-Darwin-arm64.dmg
          - **Linux**: AlcedoStudio-${{ steps.version.outputs.version }}-Linux-x86_64.AppImage
          - **Android**: AlcedoStudio-${{ steps.version.outputs.version }}-Android-arm64.apk
          - **Source**: AlcedoStudio-${{ steps.version.outputs.version }}-Source.zip / .tar.gz

          ### System Requirements
          - Windows 10/11 (64-bit), GPU driver 570+
          - macOS 13+ (Apple Silicon / Intel)
          - Ubuntu 22.04+ / Fedora 38+ (x86_64)
          - Android 7.0+ (API 24+, arm64-v8a)

          ### SHA-256 Checksums
          See SHA256SUMS.txt in the release assets.
          HEREDOC

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # ── Source Archive (guaranteed asset) ────────────────────────────────────
  source-archive:
    name: Create Source Archive
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archives
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          git archive --format=zip --prefix="AlcedoStudio-${version}/" -o "AlcedoStudio-${version}-Source.zip" HEAD
          git archive --format=tar.gz --prefix="AlcedoStudio-${version}/" -o "AlcedoStudio-${version}-Source.tar.gz" HEAD
          echo "Source archives created:"
          ls -lh AlcedoStudio-*.zip AlcedoStudio-*.tar.gz

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: |
            AlcedoStudio-*.zip
            AlcedoStudio-*.tar.gz

  # ── Windows Build ────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: prepare
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare third-party source trees
        shell: bash
        run: bash scripts/ci_prepare_third_party.sh

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt6 (MSVC)
        shell: pwsh
        run: |
          pip install aqtinstall
          # Discover available architectures for Qt 6.7.0
          aqt list-qt windows desktop --arch 6.7.0
          # Install MSVC 2019 64-bit Qt (compatible with MSVC 2022 toolchain)
          aqt install-qt windows desktop 6.7.0 win64_msvc2019_64 -O C:\Qt
          # Verify
          Test-Path "C:\Qt\6.7.0\msvc2019_64\bin\qmake.exe"

      - name: Clone vcpkg to source tree
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          .\vcpkg\vcpkg.exe install `
            opencv4:x64-windows eigen3:x64-windows lcms:x64-windows `
            xxhash:x64-windows openimageio:x64-windows opencolorio:x64-windows `
            exiv2:x64-windows libraw:x64-windows duckdb:x64-windows `
            highway:x64-windows protobuf:x64-windows grpc:x64-windows `
            --recurse

      - name: Install DuckDB extensions
        shell: pwsh
        run: |
          $duckdbExe = Get-ChildItem -Path "vcpkg\installed\x64-windows\bin" -Filter "duckdb.exe" -Recurse | Select-Object -First 1
          if (-not $duckdbExe) {
            $duckdbExe = Get-ChildItem -Path "vcpkg\installed\x64-windows\tools" -Filter "duckdb.exe" -Recurse | Select-Object -First 1
          }
          if ($duckdbExe) {
            $extDir = Join-Path $env:RUNNER_TEMP "duckdb_extensions"
            New-Item -ItemType Directory -Force -Path $extDir | Out-Null
            & $duckdbExe.FullName -c "SET extension_directory='$extDir'; INSTALL vss; INSTALL fts;"
            $vssExt = Get-ChildItem -Path $extDir -Filter "vss.duckdb_extension" -Recurse | Select-Object -First 1
            $ftsExt = Get-ChildItem -Path $extDir -Filter "fts.duckdb_extension" -Recurse | Select-Object -First 1
            if ($vssExt) { echo "ALCEDO_DUCKDB_VSS_EXTENSION=$($vssExt.FullName)" >> $env:GITHUB_ENV }
            if ($ftsExt) { echo "ALCEDO_DUCKDB_FTS_EXTENSION=$($ftsExt.FullName)" >> $env:GITHUB_ENV }
          } else {
            echo "WARNING: DuckDB CLI not found in vcpkg; extensions will be resolved by CMake"
          }

      - name: Configure CMake
        shell: cmd
        env:
          QT_PREFIX: C:\Qt\6.7.0\msvc2019_64
          VCPKG_ROOT: vcpkg\installed\x64-windows
        run: |
          cmake --preset win_release ^
            -DCMAKE_PREFIX_PATH="%QT_PREFIX%;%VCPKG_ROOT%" ^
            -DALCEDO_DUCKDB_VSS_EXTENSION="%ALCEDO_DUCKDB_VSS_EXTENSION%" ^
            -DALCEDO_DUCKDB_FTS_EXTENSION="%ALCEDO_DUCKDB_FTS_EXTENSION%"

      - name: Build
        shell: cmd
        run: |
          cmake --build --preset win_release --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $qtDir = "C:\Qt\6.7.0\msvc2019_64"
          try {
            & powershell -File scripts\package_windows.ps1 `
              -QtDir "$qtDir" `
              -BuildDir build\release
          } catch {
            Write-Host "WARNING: Packaging script failed: $_"
          }

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          # Look for exe, msi, zip in package output and build dirs
          $candidates = @(
            "build\release\package\*.exe",
            "build\release\package\*.msi",
            "build\release\package\*.zip",
            "build\release\*.exe",
            "build\install\bin\*.exe"
          )
          foreach ($pattern in $candidates) {
            $files = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
            foreach ($f in $files) {
              $dest = "AlcedoStudio-$version-Windows-AMD64$($f.Extension)"
              Copy-Item $f.FullName $dest -ErrorAction SilentlyContinue
              Write-Host "Collected: $dest"
            }
          }
          # Also try to zip the install directory if no installer was generated
          if (-not (Test-Path "AlcedoStudio-*.exe") -and -not (Test-Path "AlcedoStudio-*.msi") -and -not (Test-Path "AlcedoStudio-*.zip")) {
            $installDir = "build\install"
            if (Test-Path $installDir) {
              Compress-Archive -Path "$installDir\*" -DestinationPath "AlcedoStudio-$version-Windows-AMD64.zip"
              Write-Host "Created zip from install directory"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-package
          path: |
            AlcedoStudio-*.exe
            AlcedoStudio-*.msi
            AlcedoStudio-*.zip
          if-no-files-found: warn

  # ── macOS Build ──────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-15
    needs: prepare
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare third-party source trees
        run: bash scripts/ci_prepare_third_party.sh

      - name: Install dependencies
        run: |
          brew update
          # Install OpenCV 4 (not 5 which has split modules) with all contrib modules
          brew install opencv@4 || brew install opencv
          brew install cmake ninja qt opencolorio duckdb exiv2 glib little-cms2 highway openimageio pkg-config xxhash eigen libomp grpc protobuf

      - name: Set OpenCV prefix for CMake
        run: |
          OPENCV_PREFIX="$(brew --prefix opencv@4 2>/dev/null || brew --prefix opencv)"
          echo "OpenCV prefix: ${OPENCV_PREFIX}"
          echo "ALCEDO_OPENCV_PREFIX=${OPENCV_PREFIX}" >> "$GITHUB_ENV"

      - name: Pre-install DuckDB extensions
        run: |
          set -euo pipefail
          duckdb_ext_dir="$(mktemp -d)"
          duckdb -c "SET extension_directory='${duckdb_ext_dir}'; INSTALL vss; INSTALL fts;"
          vss_path="$(find "${duckdb_ext_dir}" -name 'vss.duckdb_extension' -type f | head -n1)"
          fts_path="$(find "${duckdb_ext_dir}" -name 'fts.duckdb_extension' -type f | head -n1)"
          if [[ -n "${vss_path}" ]]; then
            echo "ALCEDO_DUCKDB_VSS_EXTENSION=${vss_path}" >> "$GITHUB_ENV"
          fi
          if [[ -n "${fts_path}" ]]; then
            echo "ALCEDO_DUCKDB_FTS_EXTENSION=${fts_path}" >> "$GITHUB_ENV"
          fi

      - name: Import signing certificate
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_BASE64}" ]]; then
            echo "WARNING: MACOS_CERT_BASE64 not set; building unsigned package"
            exit 0
          fi
          cert_path="$RUNNER_TEMP/build_cert.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "${MACOS_CERT_BASE64}" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path" 2>/dev/null || true
          security list-keychain -d user -s "$keychain_path"
          rm -f "$cert_path"

      - name: Build & Package
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          qt_prefix="$(brew --prefix qt)"
          opencv_prefix="${ALCEDO_OPENCV_PREFIX:-}"
          version="${{ needs.prepare.outputs.version }}"
          codesign_identity="${MACOS_CODESIGN_IDENTITY:--}"
          # Set CMAKE_PREFIX_PATH to include OpenCV
          if [[ -n "${opencv_prefix}" ]]; then
            export CMAKE_PREFIX_PATH="${opencv_prefix}:${CMAKE_PREFIX_PATH:-}"
          fi
          bash scripts/package_macos.sh \
            --qt-prefix "$qt_prefix" \
            --version "${version}" \
            --codesign-identity "$codesign_identity" \
            --codesign-timestamp

      - name: Notarize
        if: env.MACOS_NOTARIZE_APPLE_ID != ''
        env:
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          MACOS_NOTARIZE_PASSWORD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          app_path="$(find build/install -name 'AlcedoStudio.app' -type d 2>/dev/null | head -n1)"
          if [[ -z "${app_path}" ]]; then
            echo "WARNING: AlcedoStudio.app not found; skipping notarization"
            exit 0
          fi
          bash scripts/notarize_macos.sh \
            --app-path "$app_path" \
            --identity "${MACOS_CODESIGN_IDENTITY:-Developer ID Application}" \
            --apple-id "$MACOS_NOTARIZE_APPLE_ID" \
            --team-id "$MACOS_NOTARIZE_TEAM_ID" \
            --password "$MACOS_NOTARIZE_PASSWORD" \
            --dmg-output "AlcedoStudio-${version}-Darwin-arm64.dmg"

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          # Look for DMG and ZIP from CPack / package_macos.sh
          dmg_path="$(find build -name '*.dmg' -type f | head -n1)"
          if [[ -n "${dmg_path}" ]]; then
            cp "${dmg_path}" "AlcedoStudio-${version}-Darwin-arm64.dmg"
          fi
          zip_path="$(find build -name '*.zip' -type f ! -name '*Source*' | head -n1)"
          if [[ -n "${zip_path}" ]]; then
            cp "${zip_path}" "AlcedoStudio-${version}-Darwin-arm64.zip"
          fi
          # If no DMG/ZIP, try to create one from .app
          if [[ ! -f "AlcedoStudio-${version}-Darwin-arm64.dmg" ]]; then
            app_path="$(find build -name 'AlcedoStudio.app' -type d | head -n1)"
            if [[ -n "${app_path}" ]]; then
              hdiutil create -volname "AlcedoStudio" -srcfolder "${app_path}" -ov -format UDZO "AlcedoStudio-${version}-Darwin-arm64.dmg"
            fi
          fi
          ls -la AlcedoStudio-* || echo "WARNING: No macOS artifacts collected"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-package
          path: |
            AlcedoStudio-*.dmg
            AlcedoStudio-*.zip
          if-no-files-found: warn

  # ── Linux Build ──────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: prepare
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare third-party source trees
        run: bash scripts/ci_prepare_third_party.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build qt6-base-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-l10n-tools \
            libopencv-dev libeigen3-dev liblcms2-dev libxxhash-dev \
            libexiv2-dev libopenimageio-dev libopencolorio-dev \
            libomp-dev libgl-dev libvulkan-dev \
            pkg-config python3

      - name: Install DuckDB
        run: |
          set -euo pipefail
          DUCKDB_VERSION="1.1.0"
          # Install CLI
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" -o /tmp/duckdb.zip
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo cp /tmp/duckdb/duckdb /usr/local/bin/
          sudo chmod +x /usr/local/bin/duckdb
          duckdb -c "SELECT version();"
          # Install C/C++ library
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/libduckdb-linux-amd64.zip" -o /tmp/libduckdb.zip
          sudo unzip -o /tmp/libduckdb.zip -d /usr/local/
          sudo cp /usr/local/duckdb.h /usr/local/include/ 2>/dev/null || true
          sudo cp /usr/local/libduckdb.so /usr/local/lib/ 2>/dev/null || true
          sudo cp /usr/local/libduckdb_static.a /usr/local/lib/ 2>/dev/null || true
          sudo ldconfig

      - name: Pre-install DuckDB extensions
        run: |
          set -euo pipefail
          duckdb_ext_dir="$(mktemp -d)"
          duckdb -c "SET extension_directory='${duckdb_ext_dir}'; INSTALL vss; INSTALL fts;"
          vss_path="$(find "${duckdb_ext_dir}" -name 'vss.duckdb_extension' -type f | head -n1)"
          fts_path="$(find "${duckdb_ext_dir}" -name 'fts.duckdb_extension' -type f | head -n1)"
          if [[ -n "${vss_path}" ]]; then
            echo "ALCEDO_DUCKDB_VSS_EXTENSION=${vss_path}" >> "$GITHUB_ENV"
          fi
          if [[ -n "${fts_path}" ]]; then
            echo "ALCEDO_DUCKDB_FTS_EXTENSION=${fts_path}" >> "$GITHUB_ENV"
          fi

      - name: Build AppImage
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          ALCEDO_VERSION="${version}" bash scripts/package_linux.sh --appimage

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          # Look for AppImage, deb, tar.gz
          appimage="$(find build -name '*.AppImage' -type f | head -n1)"
          if [[ -n "${appimage}" ]]; then
            cp "${appimage}" "AlcedoStudio-${version}-Linux-x86_64.AppImage"
          fi
          deb="$(find build -name '*.deb' -type f | head -n1)"
          if [[ -n "${deb}" ]]; then
            cp "${deb}" "AlcedoStudio-${version}-Linux-x86_64.deb"
          fi
          # Fallback: create tar.gz from staging
          if [[ ! -f "AlcedoStudio-${version}-Linux-x86_64.AppImage" ]]; then
            staging_dir="$(find build -name 'staging' -type d | head -n1)"
            if [[ -n "${staging_dir}" && -d "${staging_dir}/usr" ]]; then
              tar czf "AlcedoStudio-${version}-Linux-x86_64.tar.gz" -C "${staging_dir}" .
              echo "Created tar.gz from staging directory"
            fi
          fi
          ls -la AlcedoStudio-* || echo "WARNING: No Linux artifacts collected"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-package
          path: |
            AlcedoStudio-*.AppImage
            AlcedoStudio-*.deb
            AlcedoStudio-*.tar.gz
          if-no-files-found: warn

  # ── Android Build ────────────────────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare third-party source trees
        run: bash scripts/ci_prepare_third_party.sh

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Install Qt6 for Android
        run: |
          set -euo pipefail
          pip install aqtinstall
          # Install Qt for Android (arm64)
          aqt install-qt linux android 6.7.0 android_arm64_v8a -O /opt/qt-android
          # Install host Qt (required for cross-compilation tools like androiddeployqt)
          aqt install-qt linux desktop 6.7.0 linux_gcc_64 -O /opt/qt-android
          # Verify
          echo "=== Qt Android directory ==="
          ls /opt/qt-android/6.7.0/android_arm64_v8a/bin/ 2>/dev/null || true
          echo "=== Qt Host directory ==="
          ls /opt/qt-android/6.7.0/gcc_64/bin/ 2>/dev/null || true
          echo "=== androiddeployqt search ==="
          find /opt/qt-android -name "androiddeployqt" -type f 2>/dev/null || true

      - name: Build APK
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          QT_ANDROID_DIR="/opt/qt-android/6.7.0/android_arm64_v8a"
          # Ensure androiddeployqt is available
          if [[ ! -x "${QT_ANDROID_DIR}/bin/androiddeployqt" ]]; then
            ANDROIDDEPLOYQT="$(find /opt/qt-android -name 'androiddeployqt' -type f -executable | head -n1)"
            if [[ -z "${ANDROIDDEPLOYQT}" ]]; then
              echo "ERROR: androiddeployqt not found anywhere under /opt/qt-android"
              exit 1
            fi
            echo "Found androiddeployqt at: ${ANDROIDDEPLOYQT}"
          fi
          bash scripts/package_android.sh \
            --qt-dir "${QT_ANDROID_DIR}" \
            --android-ndk "${ANDROID_NDK}" \
            --sdk-dir "${ANDROID_HOME}" \
            --version "${version}"

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          apk="$(find build -name '*.apk' -type f | head -n1)"
          if [[ -n "${apk}" ]]; then
            cp "${apk}" "AlcedoStudio-${version}-Android-arm64.apk"
          fi
          ls -la AlcedoStudio-* || echo "WARNING: No Android artifacts collected"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-package
          path: AlcedoStudio-*.apk
          if-no-files-found: warn

  # ── Release ──────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-windows, build-macos, build-linux, build-android, source-archive]
    if: always() && needs.prepare.result == 'success' && needs.source-archive.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Download source archive
        uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64-package
          path: release-assets
        continue-on-error: true

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-package
          path: release-assets
        continue-on-error: true

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-package
          path: release-assets
        continue-on-error: true

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-package
          path: release-assets
        continue-on-error: true

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if compgen -G "release-assets/*" > /dev/null 2>&1; then
            cd release-assets
            sha256sum * > ../SHA256SUMS.txt 2>/dev/null || true
            mv ../SHA256SUMS.txt . 2>/dev/null || true
            echo "Checksums generated:"
            cat SHA256SUMS.txt 2>/dev/null || echo "No files to checksum"
          else
            echo "WARNING: No release assets found"
            echo "No assets" > release-assets/SHA256SUMS.txt
          fi

      - name: List release assets
        run: ls -la release-assets/ 2>/dev/null || echo "No assets directory"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"
          is_prerelease="${{ needs.prepare.outputs.is_prerelease }}"

          # Delete existing release if exists (for re-runs)
          gh release delete "${tag}" --yes --cleanup-tag 2>/dev/null || true

          prerelease_flag=""
          if [[ "${is_prerelease}" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          # Create release with assets (or without if none)
          if compgen -G "release-assets/*" > /dev/null 2>&1; then
            gh release create "${tag}" \
              --title "AlcedoStudio ${version}" \
              --notes-file RELEASE_NOTES.md \
              ${prerelease_flag} \
              release-assets/*
          else
            gh release create "${tag}" \
              --title "AlcedoStudio ${version}" \
              --notes-file RELEASE_NOTES.md \
              ${prerelease_flag}
          fi

          echo "Release created: ${tag}"

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          echo "=== Verifying release ${tag} ==="
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}"

  # ── Notification ─────────────────────────────────────────────────────────
  notify:
    name: Release Notification
    runs-on: ubuntu-latest
    needs: [release]
    if: always()
    steps:
      - name: Release Status
        run: |
          echo "============================================"
          echo "  AlcedoStudio Release Workflow Complete"
          echo "============================================"
          echo "  Status: ${{ needs.release.result }}"
          echo "  Repository: ${{ github.repository }}"
          if [[ "${{ needs.release.result }}" == "success" ]]; then
            echo "  Release published successfully!"
          else
            echo "  Release encountered issues. Check the logs above."
          fi
