name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ALCEDO_VERSION: ${{ inputs.version || '' }}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ -n "${ALCEDO_VERSION}" ]]; then
            version="${ALCEDO_VERSION}"
            tag="v${version}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")"
            version="${version#v}"
            tag="v${version}"
          fi

          is_prerelease="false"
          if [[ "${version}" == *"-"* ]] || [[ "${{ inputs.prerelease }}" == "true" ]]; then
            is_prerelease="true"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${version} (tag: ${tag}, prerelease: ${is_prerelease})"

      - name: Generate changelog
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")"
          if [[ -n "${prev_tag}" ]]; then
            changes="$(git log "${prev_tag}..HEAD" --pretty=format:"- %s (%h)" --no-merges)"
          else
            changes="$(git log --pretty=format:"- %s (%h)" --no-merges -50)"
          fi

          cat > RELEASE_NOTES.md <<HEREDOC
          ## AlcedoStudio ${{ steps.version.outputs.version }}

          ### Changes
          ${changes}

          ### Downloads
          - **Windows**: AlcedoStudio-${{ steps.version.outputs.version }}-Windows-AMD64.exe
          - **macOS**: AlcedoStudio-${{ steps.version.outputs.version }}-Darwin-arm64.dmg
          - **Linux**: AlcedoStudio-${{ steps.version.outputs.version }}-Linux-x86_64.AppImage
          - **Android**: AlcedoStudio-${{ steps.version.outputs.version }}-Android-arm64.apk

          ### System Requirements
          - Windows 10/11 (64-bit), GPU driver 570+
          - macOS 13+ (Apple Silicon / Intel)
          - Ubuntu 22.04+ / Fedora 38+ (x86_64)
          - Android 7.0+ (API 24+, arm64-v8a)

          ### SHA-256 Checksums
          See SHA256SUMS.txt in the release assets.
          HEREDOC

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: prepare
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare third-party source trees
        shell: bash
        run: bash scripts/ci_prepare_third_party.sh

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt6
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.7.0 win64_msvc2022_64 -O C:\Qt

      - name: Install vcpkg dependencies
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install `
            opencv4:x64-windows eigen3:x64-windows lcms:x64-windows `
            xxhash:x64-windows openimageio:x64-windows opencolorio:x64-windows `
            exiv2:x64-windows libraw:x64-windows duckdb:x64-windows `
            highway:x64-windows protobuf:x64-windows grpc:x64-windows `
            --recurse

      - name: Build
        shell: cmd
        env:
          QT_DIR: C:\Qt\6.7.0\msvc2022_64
          VCPKG_ROOT: C:\vcpkg\installed\x64-windows
        run: |
          cmake --preset windows_release
          cmake --build --preset windows_release --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          powershell -File scripts\package_windows.ps1 `
            -QtDir "C:\Qt\6.7.0\msvc2022_64" `
            -BuildDir build\windows-release

      - name: Rename with version
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $exe = Get-ChildItem -Path build -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "AlcedoStudio-$version-Windows-AMD64.exe"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-package
          path: AlcedoStudio-*.exe
          if-no-files-found: warn

  build-macos:
    name: Build macOS
    runs-on: macos-15
    needs: prepare
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare third-party source trees
        run: bash scripts/ci_prepare_third_party.sh

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja qt opencv opencolorio duckdb exiv2 glib little-cms2 highway openimageio pkg-config xxhash eigen libomp grpc protobuf

      - name: Pre-install DuckDB extensions
        run: |
          set -euo pipefail
          duckdb_ext_dir="$(mktemp -d)"
          duckdb -c "SET extension_directory='${duckdb_ext_dir}'; INSTALL vss; INSTALL fts;"
          vss_path="$(find "${duckdb_ext_dir}" -name 'vss.duckdb_extension' -type f | head -n1)"
          fts_path="$(find "${duckdb_ext_dir}" -name 'fts.duckdb_extension' -type f | head -n1)"
          echo "ALCEDO_DUCKDB_VSS_EXTENSION=${vss_path}" >> "$GITHUB_ENV"
          echo "ALCEDO_DUCKDB_FTS_EXTENSION=${fts_path}" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_BASE64}" ]]; then
            echo "WARNING: MACOS_CERT_BASE64 not set; building unsigned package"
            exit 0
          fi
          cert_path="$RUNNER_TEMP/build_cert.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "${MACOS_CERT_BASE64}" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path" 2>/dev/null || true
          security list-keychain -d user -s "$keychain_path"
          rm -f "$cert_path"

      - name: Build & Package
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          qt_prefix="$(brew --prefix qt)"
          version="${{ needs.prepare.outputs.version }}"
          codesign_identity="${MACOS_CODESIGN_IDENTITY:--}"
          bash scripts/package_macos.sh \
            --qt-prefix "$qt_prefix" \
            --version "${version}" \
            --codesign-identity "$codesign_identity" \
            --codesign-options "--options;runtime" \
            --codesign-timestamp

      - name: Notarize
        if: env.MACOS_NOTARIZE_APPLE_ID != ''
        env:
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          MACOS_NOTARIZE_PASSWORD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          app_path="$(find build/install -name 'AlcedoStudio.app' -type d 2>/dev/null | head -n1)"
          if [[ -z "${app_path}" ]]; then
            echo "WARNING: AlcedoStudio.app not found; skipping notarization"
            exit 0
          fi
          bash scripts/notarize_macos.sh \
            --app-path "$app_path" \
            --identity "${MACOS_CODESIGN_IDENTITY:-Developer ID Application}" \
            --apple-id "$MACOS_NOTARIZE_APPLE_ID" \
            --team-id "$MACOS_NOTARIZE_TEAM_ID" \
            --password "$MACOS_NOTARIZE_PASSWORD" \
            --dmg-output "AlcedoStudio-${version}-Darwin-arm64.dmg"

      - name: Rename DMG with version
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          dmg_path="$(find build -name '*.dmg' -type f | head -n1)"
          if [[ -n "${dmg_path}" ]]; then
            cp "${dmg_path}" "AlcedoStudio-${version}-Darwin-arm64.dmg"
          else
            echo "WARNING: No DMG found, checking for .app"
            app_path="$(find build -name 'AlcedoStudio.app' -type d | head -n1)"
            if [[ -n "${app_path}" ]]; then
              # Create DMG manually
              hdiutil create -volname "AlcedoStudio" -srcfolder "${app_path}" -ov -format UDZO "AlcedoStudio-${version}-Darwin-arm64.dmg"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-package
          path: AlcedoStudio-*.dmg
          if-no-files-found: warn

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: prepare
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare third-party source trees
        run: bash scripts/ci_prepare_third_party.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build qt6-base-dev qt6-tools-dev \
            libopencv-dev libeigen3-dev liblcms2-dev libxxhash-dev \
            libexiv2-dev libopenimageio-dev libopencolorio-dev \
            libomp-dev libgl-dev libvulkan-dev \
            pkg-config python3

      - name: Install DuckDB
        run: |
          set -euo pipefail
          DUCKDB_VERSION="1.1.0"
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" -o /tmp/duckdb.zip
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo cp /tmp/duckdb/duckdb /usr/local/bin/
          sudo chmod +x /usr/local/bin/duckdb
          duckdb -c "SELECT version();"

      - name: Build AppImage
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          ALCEDO_VERSION="${version}" bash scripts/package_linux.sh --appimage

      - name: Rename with version
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          appimage="$(find build -name '*.AppImage' -type f | head -n1)"
          if [[ -n "${appimage}" ]]; then
            cp "${appimage}" "AlcedoStudio-${version}-Linux-x86_64.AppImage"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-package
          path: AlcedoStudio-*.AppImage
          if-no-files-found: warn

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Install Qt6 for Android
        run: |
          pip install aqtinstall
          aqt install-qt linux android 6.7.0 android_arm64_v8a -O /opt/qt-android

      - name: Build APK
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          bash scripts/package_android.sh \
            --qt-dir /opt/qt-android/6.7.0/android_arm64_v8a \
            --android-ndk "${ANDROID_NDK}" \
            --sdk-dir "${ANDROID_HOME}" \
            --version "${version}"

      - name: Rename APK with version
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          apk="$(find build -name '*.apk' -type f | head -n1)"
          if [[ -n "${apk}" ]]; then
            cp "${apk}" "AlcedoStudio-${version}-Android-arm64.apk"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-package
          path: AlcedoStudio-*.apk
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-windows, build-macos, build-linux, build-android]
    if: always() && needs.prepare.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64-package
          path: release-assets
        continue-on-error: true

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-package
          path: release-assets
        continue-on-error: true

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-package
          path: release-assets
        continue-on-error: true

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-package
          path: release-assets
        continue-on-error: true

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if compgen -G "release-assets/*" > /dev/null 2>&1; then
            cd release-assets
            sha256sum * > ../SHA256SUMS.txt 2>/dev/null || true
            mv ../SHA256SUMS.txt . 2>/dev/null || true
            echo "Checksums generated:"
            cat SHA256SUMS.txt 2>/dev/null || echo "No files to checksum"
          else
            echo "WARNING: No release assets found"
            echo "No assets" > release-assets/SHA256SUMS.txt
          fi

      - name: List release assets
        run: ls -la release-assets/ 2>/dev/null || echo "No assets directory"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"
          is_prerelease="${{ needs.prepare.outputs.is_prerelease }}"

          # Delete existing release if exists (for re-runs)
          gh release delete "${tag}" --yes --cleanup-tag 2>/dev/null || true

          prerelease_flag=""
          if [[ "${is_prerelease}" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          # Create release with assets (or without if none)
          if compgen -G "release-assets/*" > /dev/null 2>&1; then
            gh release create "${tag}" \
              --title "AlcedoStudio ${version}" \
              --notes-file RELEASE_NOTES.md \
              ${prerelease_flag} \
              release-assets/*
          else
            gh release create "${tag}" \
              --title "AlcedoStudio ${version}" \
              --notes-file RELEASE_NOTES.md \
              ${prerelease_flag}
          fi

          echo "Release created: ${tag}"

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          echo "=== Verifying release ${tag} ==="
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}"

  notify:
    name: Release Notification
    runs-on: ubuntu-latest
    needs: [release]
    if: always()
    steps:
      - name: Release Status
        run: |
          echo "============================================"
          echo "  AlcedoStudio Release Workflow Complete"
          echo "============================================"
          echo "  Status: ${{ needs.release.result }}"
          echo "  Repository: ${{ github.repository }}"
          if [[ "${{ needs.release.result }}" == "success" ]]; then
            echo "  Release published successfully!"
          else
            echo "  Release encountered issues. Check the logs above."
          fi
