name: Linux Package Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ORT_VERSION: "1.20.1"

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
            libpng-dev libjpeg-dev libtiff-dev liblcms2-dev \
            libopenexr-dev \
            libgles2-mesa-dev libegl1-mesa-dev \
            desktop-file-utils \
            file

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '2024.12.16'

      - name: Download ONNX Runtime
        run: |
          ORT_DIR="${GITHUB_WORKSPACE}/third_party/onnxruntime-linux"
          if [ ! -d "${ORT_DIR}" ]; then
            mkdir -p "${ORT_DIR}"
            ORT_PKG="onnxruntime-linux-x64-${{ env.ORT_VERSION }}.tgz"
            wget -q "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ORT_VERSION }}/${ORT_PKG}" -O /tmp/ort.tgz
            tar xzf /tmp/ort.tgz -C /tmp
            cp -r /tmp/onnxruntime-linux-x64-${{ env.ORT_VERSION }}/. "${ORT_DIR}/"
            rm -f /tmp/ort.tgz
            echo "ONNX Runtime extracted to ${ORT_DIR}"
          fi
          echo "ALCEDO_ORT_DIR=${ORT_DIR}" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DVCPKG_ROOT=${VCPKG_ROOT} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -Donnxruntime_ROOT=${ALCEDO_ORT_DIR}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Install AppImage tools
        run: |
          sudo apt-get install -y libfuse2
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O linuxdeployqt
          chmod +x linuxdeployqt
          sudo mv linuxdeployqt /usr/local/bin/

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Build AppImage
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh --appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AlcedoStudio-AppImage
          path: build-package/*.AppImage
          retention-days: 30

  build-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config dpkg-dev \
            libgl1-mesa-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
            libpng-dev libjpeg-dev libtiff-dev liblcms2-dev \
            libopenexr-dev \
            libgles2-mesa-dev libegl1-mesa-dev

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '2024.12.16'

      - name: Download ONNX Runtime
        run: |
          ORT_DIR="${GITHUB_WORKSPACE}/third_party/onnxruntime-linux"
          if [ ! -d "${ORT_DIR}" ]; then
            mkdir -p "${ORT_DIR}"
            ORT_PKG="onnxruntime-linux-x64-${{ env.ORT_VERSION }}.tgz"
            wget -q "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ORT_VERSION }}/${ORT_PKG}" -O /tmp/ort.tgz
            tar xzf /tmp/ort.tgz -C /tmp
            cp -r /tmp/onnxruntime-linux-x64-${{ env.ORT_VERSION }}/. "${ORT_DIR}/"
            rm -f /tmp/ort.tgz
          fi
          echo "ALCEDO_ORT_DIR=${ORT_DIR}" >> "$GITHUB_ENV"

      - name: Build .deb package
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh --deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: AlcedoStudio-deb
          path: build-package/*.deb
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build-package/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
