name: macOS Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (Release or Debug)'
        required: false
        default: 'Release'

permissions:
  contents: write

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build macOS Package
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare third-party source trees
        run: bash scripts/ci_prepare_third_party.sh

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja qt opencv opencolorio duckdb exiv2 glib little-cms2 highway openimageio pkg-config xxhash eigen libomp grpc protobuf

      - name: Pre-install DuckDB extensions
        run: |
          set -euo pipefail
          duckdb_ext_dir="$(mktemp -d)"
          duckdb -c "SET extension_directory='${duckdb_ext_dir}'; INSTALL vss; INSTALL fts;"
          vss_path="$(find "${duckdb_ext_dir}" -name 'vss.duckdb_extension' -type f | head -n1)"
          fts_path="$(find "${duckdb_ext_dir}" -name 'fts.duckdb_extension' -type f | head -n1)"
          if [ -z "${vss_path}" ]; then
            echo "Failed to locate installed vss.duckdb_extension under ${duckdb_ext_dir}" >&2
            find "${duckdb_ext_dir}" -type f >&2 || true
            exit 1
          fi
          if [ -z "${fts_path}" ]; then
            echo "Failed to locate installed fts.duckdb_extension under ${duckdb_ext_dir}" >&2
            find "${duckdb_ext_dir}" -type f >&2 || true
            exit 1
          fi
          echo "Resolved VSS extension: ${vss_path}"
          echo "Resolved FTS extension: ${fts_path}"
          echo "ALCEDO_DUCKDB_VSS_EXTENSION=${vss_path}" >> "$GITHUB_ENV"
          echo "ALCEDO_DUCKDB_FTS_EXTENSION=${fts_path}" >> "$GITHUB_ENV"

      - name: Setup Qt6 prefix
        run: |
          qt_prefix="$(brew --prefix qt 2>/dev/null || brew --prefix qt6 2>/dev/null || true)"
          if [ -z "${qt_prefix}" ] || [ ! -d "${qt_prefix}" ]; then
            echo "Qt not found via brew, searching common paths..."
            for path in /opt/homebrew/opt/qt6 /opt/homebrew/opt/qt /usr/local/opt/qt6 /usr/local/opt/qt; do
              if [ -d "${path}" ]; then
                qt_prefix="${path}"
                break
              fi
            done
          fi
          if [ -z "${qt_prefix}" ] || [ ! -d "${qt_prefix}" ]; then
            echo "ERROR: Could not find Qt installation" >&2
            exit 1
          fi
          echo "Found Qt at: ${qt_prefix}"
          mkdir -p build/qt-prefix
          ln -sf "${qt_prefix}/bin" build/qt-prefix/bin || true
          ln -sf "${qt_prefix}/lib" build/qt-prefix/lib || true
          ln -sf "${qt_prefix}/include" build/qt-prefix/include || true
          ln -sf "${qt_prefix}/share" build/qt-prefix/share || true
          ln -sf "${qt_prefix}/plugins" build/qt-prefix/plugins || true
          ls -la build/qt-prefix/
          echo "Qt6_DIR=${qt_prefix}/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "QT_DIR=${qt_prefix}" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: |
          cmake --preset macos_release \
            -DALCEDO_DUCKDB_VSS_EXTENSION="${ALCEDO_DUCKDB_VSS_EXTENSION}" \
            -DALCEDO_DUCKDB_FTS_EXTENSION="${ALCEDO_DUCKDB_FTS_EXTENSION}" \
          || {
            echo "=== CMake configure failed. Dumping logs ==="
            cat build/macos-release/CMakeFiles/CMakeError.log 2>/dev/null || true
            echo "=== CMakeOutput.log tail ==="
            tail -n 100 build/macos-release/CMakeFiles/CMakeOutput.log 2>/dev/null || true
            exit 1
          }

      - name: Build
        run: cmake --build --preset macos_release --parallel $(sysctl -n hw.logicalcpu)

      - name: Package
        run: cmake --build --preset macos_package

      - name: List generated packages
        run: |
          for f in build/install/*.dmg build/install/*.zip; do
            [ -e "$f" ] || continue
            size=$(du -h "$f" | cut -f1)
            echo "  $(basename "$f") ($size)"
          done

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AlcedoStudio-macOS-DMG
          path: build/install/*.dmg
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AlcedoStudio-macOS-ZIP
          path: build/install/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          assets=()
          for f in build/install/*.dmg build/install/*.zip; do
            [ -e "$f" ] && assets+=("$f")
          done
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No package assets found."
            exit 1
          fi
          # Try to create release; if it already exists, upload assets instead.
          if gh release create "$tag" \
              --title "Alcedo Studio $tag" \
              --notes "Alcedo Studio $tag release packages." \
              "${assets[@]}"; then
            echo "Created release and uploaded assets."
          else
            echo "Release may already exist; uploading assets with --clobber..."
            gh release upload "$tag" "${assets[@]}" --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
