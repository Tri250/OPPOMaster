name: C++ CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-hosted:
    name: Windows hosted core/raw
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      QT_VERSION: 6.9.3
      QT_PREFIX: 'C:\Qt\6.9.3\msvc2022_64'
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull CI RAW fixtures
        shell: bash
        run: git lfs pull --include="alcedo_studio/tests/resources/sample_images/ci_rawfiles/**"

      - name: Prepare third-party source trees
        shell: bash
        run: bash scripts/ci_prepare_third_party.sh

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir C:\Qt

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Configure
        shell: cmd
        run: scripts\msvc_env.cmd --preset win_hosted_ci -DCMAKE_PREFIX_PATH="%QT_PREFIX%\lib\cmake"

      - name: Build CI targets
        shell: cmd
        run: scripts\msvc_env.cmd --build --preset win_hosted_ci --parallel 4

      - name: Test
        shell: pwsh
        run: |
          $vcpkgBin = Join-Path $pwd "vcpkg\installed\x64-windows\bin"
          $env:PATH = "$vcpkgBin;$env:PATH"
          ctest --preset win_hosted_ci --output-on-failure

  macos-arm-metal:
    name: macOS arm64 Metal
    runs-on: macos-15
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull CI RAW fixtures
        run: git lfs pull --include="alcedo_studio/tests/resources/sample_images/ci_rawfiles/**"

      - name: Prepare third-party source trees
        run: bash scripts/ci_prepare_third_party.sh

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja qt opencv opencolorio duckdb exiv2 glib libraw little-cms2 highway openimageio pkg-config xxhash eigen libomp

      - name: Configure
        run: cmake --preset macos_arm_metal_ci

      - name: Build CI targets
        run: cmake --build --preset macos_arm_metal_ci --parallel 4

      - name: Test
        run: ctest --preset macos_arm_metal_ci --output-on-failure
