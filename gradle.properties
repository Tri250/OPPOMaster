org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# =============================================
# 沙箱代理配置（必须）
# =============================================
# 沙箱环境通过 127.0.0.1:18080 代理访问外网
# 必须显式配置代理，否则 Gradle 内部 HTTP client 会卡 SSL 握手 30 秒
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.local|*.svc|*.cluster.local
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.local|*.svc|*.cluster.local

# 同时支持 SOCKS 代理
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -DsocksProxyHost=127.0.0.1 -DsocksProxyPort=18080

# =============================================
# 网络优化配置
# =============================================

# 启用并行构建
org.gradle.parallel=true
# 启用按需配置
org.gradle.configureondemand=true
# 启用构建缓存
org.gradle.caching=true

# 限制工作进程数（避免 DNS / 连接数过多导致 timeout）
org.gradle.workers.max=4

# =============================================
# HTTP 超时配置（解决网络不稳定问题）
# =============================================
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000

# 启用 HTTP keep-alive（保持连接复用，减少握手）
systemProp.http.keepAlive=true
systemProp.https.keepAlive=true

# 启用连接池
systemProp.http.maxConnections=20

# 启用压缩传输
systemProp.http.compression=true

# 增加 DNS 缓存时间
sun.net.inetaddr.ttl=300
networkaddress.cache.ttl=300

# =============================================
# Gradle 网络重试配置
# =============================================
# HTTP 重试次数
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

# 启用 Gradle 网络重试
systemProp.org.gradle.internal.http.numRetries=5
systemProp.org.gradle.internal.http.initialBackOff=1000
